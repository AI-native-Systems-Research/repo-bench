<svg viewBox="0 0 900 560" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="The repo-bench pipeline. One run command drives six deterministic stages: aggregate scrapes merged PRs, filter ranks the perf-relevant ones, fetch-diffs downloads their diffs, snapshot pins a SHA before the earliest of them, workloads extracts signals, bench-spec renders the handoff contract. A separate match command grades a findings.json against the filtered diffs using an LLM judge.">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="ah"/>
    </marker>
    <style>
      :root {
        --ink:      #15181d;
        --muted:    #5b6472;
        --hair:     #ccd3dc;
        --rule:     #8a95a3;
        --surface:  #ffffff;
        --green:    #0f7a46;
        --green-bg: #e4f5ec;
        --violet:   #6d31d0;
        --violet-bg:#f2ecfe;
        --blue:     #1d64d8;
        --blue-bg:  #e8f1fe;
        --amber:    #9a6309;
        --amber-bg: #fdf4e3;
        --shade:    #f3f5f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:      #e9ecf1;
          --muted:    #a3adbb;
          --hair:     #3c4553;
          --rule:     #76818f;
          --surface:  #171b21;
          --green:    #4ddb95;
          --green-bg: #15372a;
          --violet:   #b38dff;
          --violet-bg:#241a3b;
          --blue:     #74a9ff;
          --blue-bg:  #16233a;
          --amber:    #e0ad5a;
          --amber-bg: #2d2516;
          --shade:    #1d2229;
        }
      }
      text { font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
      .h    { font-size: 13px;   font-weight: 650; fill: var(--ink); }
      .b    { font-size: 11px;   font-weight: 400; fill: var(--muted); }
      .cap  { font-size: 10.5px; font-weight: 650; fill: var(--muted); letter-spacing: .09em; }
      .tiny { font-size: 10px;   font-weight: 400; fill: var(--muted); }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
              font-size: 11px; font-weight: 500; fill: var(--ink); }
      .ah   { fill: var(--rule); }
      .flow { stroke: var(--rule); stroke-width: 1.5; fill: none; }
      .thin { stroke: var(--hair); stroke-width: 1; fill: none; }
      .det  { fill: var(--green-bg);  stroke: var(--green);  stroke-width: 1.4; }
      .llm  { fill: var(--violet-bg); stroke: var(--violet); stroke-width: 1.4; }
      .art  { fill: var(--surface);   stroke: var(--rule);   stroke-width: 1.2; }
      .inp  { fill: var(--blue-bg);   stroke: var(--blue);   stroke-width: 1.4; }
      .out  { fill: var(--amber-bg);  stroke: var(--amber);  stroke-width: 1.4; }
      .band { fill: var(--shade); }
    </style>
  </defs>

  <!-- BAND 1: repo-bench run -->
  <rect x="24" y="40" width="852" height="268" rx="8" class="band"/>
  <text x="40" y="30" class="cap">ONE COMMAND · ZERO LLM CALLS · RE-RUN IS A NO-OP</text>
  <text x="40" y="64" class="mono" fill="var(--green)">repo-bench run</text>

  <!-- stage 1 -->
  <rect x="40" y="80" width="192" height="68" rx="6" class="det"/>
  <text x="56" y="102" class="h">1 · aggregate</text>
  <text x="56" y="120" class="b">Scrape every merged PR in</text>
  <text x="56" y="134" class="b">the window. Cached.</text>

  <path d="M232 114 L264 114" class="flow" marker-end="url(#a2)"/>

  <!-- stage 2 -->
  <rect x="264" y="80" width="192" height="68" rx="6" class="det"/>
  <text x="280" y="102" class="h">2 · filter</text>
  <text x="280" y="120" class="b">Rules drop bots/chores,</text>
  <text x="280" y="134" class="b">rank what's left.</text>

  <path d="M456 114 L488 114" class="flow" marker-end="url(#a2)"/>

  <!-- stage 3 -->
  <rect x="488" y="80" width="192" height="68" rx="6" class="det"/>
  <text x="504" y="102" class="h">3 · fetch-diffs</text>
  <text x="504" y="120" class="b">Unified diff per surviving</text>
  <text x="504" y="134" class="b">PR. 5–10 min / ~600.</text>

  <path d="M680 114 L712 114" class="flow" marker-end="url(#a2)"/>

  <!-- stage 4 -->
  <rect x="712" y="80" width="148" height="68" rx="6" class="det"/>
  <text x="728" y="102" class="h">4 · snapshot</text>
  <text x="728" y="120" class="b">Pin a SHA before</text>
  <text x="728" y="134" class="b">the earliest PR.</text>

  <!-- down into 5/6 -->
  <path d="M786 148 L786 172 Q786 182 776 182 L300 182 Q290 182 290 192 L290 212" class="flow" marker-end="url(#a2)"/>

  <!-- stage 5 -->
  <rect x="198" y="214" width="192" height="68" rx="6" class="det"/>
  <text x="214" y="236" class="h">5 · workloads</text>
  <text x="214" y="254" class="b">Regex out model / feature /</text>
  <text x="214" y="268" class="b">hardware signals.</text>

  <path d="M390 248 L422 248" class="flow" marker-end="url(#a2)"/>

  <!-- stage 6 -->
  <rect x="422" y="214" width="192" height="68" rx="6" class="det"/>
  <text x="438" y="236" class="h">6 · bench-spec</text>
  <text x="438" y="254" class="b">Render the cross-module</text>
  <text x="438" y="268" class="b">handoff contract.</text>

  <!-- artifacts produced -->
  <rect x="40" y="214" width="140" height="68" rx="6" class="art"/>
  <text x="56" y="234" class="cap">PRODUCES</text>
  <text x="56" y="252" class="mono">view/prs.jsonl</text>
  <text x="56" y="268" class="mono">snapshot.json</text>

  <rect x="636" y="214" width="224" height="68" rx="6" class="out"/>
  <text x="652" y="236" class="h">The answer key</text>
  <text x="652" y="254" class="b">Filtered PRs + their diffs +</text>
  <text x="652" y="268" class="b">the SHA discovery must not see.</text>

  <!-- BAND 2: the gap -->
  <text x="40" y="340" class="cap">MEANWHILE, OUTSIDE THIS TOOL</text>
  <line x1="24" y1="348" x2="876" y2="348" class="thin"/>

  <rect x="40" y="362" width="380" height="64" rx="6" class="inp"/>
  <text x="56" y="384" class="h">Any discovery method</text>
  <text x="56" y="402" class="b">Reads source at the pinned SHA — and nothing else.</text>
  <text x="56" y="418" class="b">Emits <tspan class="mono">findings.json</tspan>: file, symbol, proposed change.</text>

  <!-- BAND 3: match -->
  <path d="M230 426 L230 452 Q230 462 240 462 L300 462" class="flow" marker-end="url(#a2)"/>
  <path d="M748 282 L748 452 Q748 462 738 462 L678 462" class="flow" marker-end="url(#a2)"/>

  <rect x="306" y="436" width="366" height="100" rx="7" class="llm"/>
  <text x="326" y="460" class="mono" fill="var(--violet)">repo-bench match</text>
  <text x="326" y="480" class="b">1 · bucket PRs whose diff touches the finding's file</text>
  <text x="326" y="496" class="b">2 · split T1 (inside the symbol) from T2 (same file)</text>
  <text x="326" y="512" class="b">3 · slice each diff to that file, then one judge call</text>
  <text x="326" y="529" class="b">→ <tspan class="mono">match_report.json</tspan> + <tspan class="mono">.md</tspan></text>

  <!-- legend -->
  <rect x="706" y="436" width="154" height="100" rx="6" class="art"/>
  <text x="722" y="458" class="cap">LEGEND</text>
  <rect x="722" y="470" width="12" height="12" rx="3" class="det"/>
  <text x="742" y="480" class="tiny">deterministic, cached</text>
  <rect x="722" y="492" width="12" height="12" rx="3" class="llm"/>
  <text x="742" y="502" class="tiny">LLM judge, ~$1–5</text>
  <rect x="722" y="514" width="12" height="12" rx="3" class="inp"/>
  <text x="742" y="524" class="tiny">input from outside</text>
</svg>
