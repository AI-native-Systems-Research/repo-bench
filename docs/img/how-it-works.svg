<svg viewBox="0 0 900 430" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A timeline: the snapshot SHA is pinned before 624 merged perf PRs. Discovery sees only the code at that commit; the PRs it never saw are the answer key. The match step grades one against the other.">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" class="arrowhead"/>
    </marker>
    <style>
      :root {
        --ink:      #15181d;
        --muted:    #5b6472;
        --hair:     #c8cfd8;
        --rule:     #8a95a3;
        --surface:  #ffffff;
        --blue:     #1d64d8;
        --blue-bg:  #e8f1fe;
        --amber:    #9a6309;
        --amber-bg: #fdf4e3;
        --violet:   #6d31d0;
        --violet-bg:#f2ecfe;
        --shade:    #f3f5f8;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --ink:      #e9ecf1;
          --muted:    #a3adbb;
          --hair:     #3c4553;
          --rule:     #76818f;
          --surface:  #171b21;
          --blue:     #74a9ff;
          --blue-bg:  #16233a;
          --amber:    #e0ad5a;
          --amber-bg: #2d2516;
          --violet:   #b38dff;
          --violet-bg:#241a3b;
          --shade:    #1d2229;
        }
      }
      text { font-family: -apple-system, "Segoe UI", Inter, system-ui, sans-serif; }
      .h     { font-size: 14.5px; font-weight: 650; fill: var(--ink); }
      .b     { font-size: 12px;   font-weight: 400; fill: var(--muted); }
      .bi    { font-size: 12px;   font-weight: 600; fill: var(--ink); }
      .cap   { font-size: 10.5px; font-weight: 650; fill: var(--muted); letter-spacing: .09em; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
               font-size: 11.5px; font-weight: 500; fill: var(--ink); }
      .arrowhead { fill: var(--rule); }
      .flow  { stroke: var(--rule); stroke-width: 1.5; fill: none; }
      .axis  { stroke: var(--rule); stroke-width: 1.5; fill: none; }
      .shade { fill: var(--shade); }
      .commit{ fill: var(--surface); stroke: var(--rule); stroke-width: 1.4; }
      .pr    { stroke: var(--amber); stroke-width: 2; stroke-linecap: round; opacity: .85; }
      .pin   { stroke: var(--blue); stroke-width: 2.5; stroke-linecap: round; }
      .boxA  { fill: var(--blue-bg);   stroke: var(--blue);   stroke-width: 1.5; }
      .boxB  { fill: var(--amber-bg);  stroke: var(--amber);  stroke-width: 1.5; }
      .boxC  { fill: var(--violet-bg); stroke: var(--violet); stroke-width: 1.5; }
      .tagA  { fill: var(--blue); }
      .tagB  { fill: var(--amber); }
    </style>
  </defs>

  <!-- TIMELINE -->
  <text x="34" y="26" class="cap">ONE AXIS: TIME</text>

  <rect x="309" y="44" width="533" height="68" rx="4" class="shade"/>
  <text x="832" y="60" class="cap" text-anchor="end" fill="var(--amber)">NEVER SHOWN TO DISCOVERY</text>

  <line x1="34" y1="92" x2="858" y2="92" class="axis"/>

  <circle cx="60"  cy="92" r="4" class="commit"/>
  <circle cx="104" cy="92" r="4" class="commit"/>
  <circle cx="148" cy="92" r="4" class="commit"/>
  <circle cx="192" cy="92" r="4" class="commit"/>
  <circle cx="236" cy="92" r="4" class="commit"/>
  <circle cx="276" cy="92" r="4" class="commit"/>
  <text x="34" y="124" class="b">repo history</text>

  <line x1="309" y1="62" x2="309" y2="122" class="pin"/>
  <circle cx="309" cy="92" r="5.5" fill="var(--blue)"/>
  <text x="317" y="140" class="mono">a690fb5b</text>
  <text x="317" y="156" class="b">the snapshot — the only code discovery sees</text>

  <g class="pr">
    <line x1="330" y1="78" x2="330" y2="106"/><line x1="342" y1="80" x2="342" y2="104"/>
    <line x1="354" y1="78" x2="354" y2="106"/><line x1="366" y1="81" x2="366" y2="103"/>
    <line x1="378" y1="78" x2="378" y2="106"/><line x1="390" y1="80" x2="390" y2="104"/>
    <line x1="402" y1="78" x2="402" y2="106"/><line x1="414" y1="81" x2="414" y2="103"/>
    <line x1="426" y1="78" x2="426" y2="106"/><line x1="438" y1="80" x2="438" y2="104"/>
    <line x1="450" y1="78" x2="450" y2="106"/><line x1="462" y1="81" x2="462" y2="103"/>
    <line x1="474" y1="78" x2="474" y2="106"/><line x1="486" y1="80" x2="486" y2="104"/>
    <line x1="498" y1="78" x2="498" y2="106"/><line x1="510" y1="81" x2="510" y2="103"/>
    <line x1="522" y1="78" x2="522" y2="106"/><line x1="534" y1="80" x2="534" y2="104"/>
    <line x1="546" y1="78" x2="546" y2="106"/><line x1="558" y1="81" x2="558" y2="103"/>
    <line x1="570" y1="78" x2="570" y2="106"/><line x1="582" y1="80" x2="582" y2="104"/>
    <line x1="594" y1="78" x2="594" y2="106"/><line x1="606" y1="81" x2="606" y2="103"/>
    <line x1="618" y1="78" x2="618" y2="106"/><line x1="630" y1="80" x2="630" y2="104"/>
    <line x1="642" y1="78" x2="642" y2="106"/><line x1="654" y1="81" x2="654" y2="103"/>
    <line x1="666" y1="78" x2="666" y2="106"/><line x1="678" y1="80" x2="678" y2="104"/>
    <line x1="690" y1="78" x2="690" y2="106"/><line x1="702" y1="81" x2="702" y2="103"/>
    <line x1="714" y1="78" x2="714" y2="106"/><line x1="726" y1="80" x2="726" y2="104"/>
    <line x1="738" y1="78" x2="738" y2="106"/><line x1="750" y1="81" x2="750" y2="103"/>
    <line x1="762" y1="78" x2="762" y2="106"/><line x1="774" y1="80" x2="774" y2="104"/>
    <line x1="786" y1="78" x2="786" y2="106"/><line x1="798" y1="81" x2="798" y2="103"/>
    <line x1="810" y1="78" x2="810" y2="106"/><line x1="822" y1="80" x2="822" y2="104"/>
    <line x1="834" y1="78" x2="834" y2="106"/><line x1="846" y1="81" x2="846" y2="103"/>
  </g>
  <text x="858" y="140" class="bi" text-anchor="end">624 merged perf PRs</text>
  <text x="858" y="156" class="b" text-anchor="end">each one an expert saying "change this" — the answer key</text>

  <!-- TWO INPUTS -->
  <path d="M170 170 L170 206" class="flow" marker-end="url(#arrow)"/>
  <path d="M730 170 L730 206" class="flow" marker-end="url(#arrow)"/>

  <rect x="34" y="208" width="330" height="90" rx="7" class="boxA"/>
  <rect x="34" y="208" width="4"   height="90" rx="2" class="tagA"/>
  <text x="54" y="232" class="h">What the method gets</text>
  <text x="54" y="252" class="b">Source at the pinned SHA. No PR titles,</text>
  <text x="54" y="268" class="b">no diffs, no changed-file list. It emits</text>
  <text x="54" y="288" class="mono">findings.json</text>
  <text x="138" y="288" class="b">— file, symbol, proposed change.</text>

  <rect x="536" y="208" width="330" height="90" rx="7" class="boxB"/>
  <rect x="862" y="208" width="4"   height="90" rx="2" class="tagB"/>
  <text x="556" y="232" class="h">What it is graded against</text>
  <text x="556" y="252" class="b">The real unified diffs of those 624 PRs.</text>
  <text x="556" y="268" class="b">Nobody wrote an answer key by hand —</text>
  <text x="556" y="288" class="b">the diffs <tspan class="bi">are</tspan> the answer key.</text>

  <!-- MATCH -->
  <path d="M199 298 L199 330 Q199 342 211 342 L330 342" class="flow" marker-end="url(#arrow)"/>
  <path d="M701 298 L701 330 Q701 342 689 342 L570 342" class="flow" marker-end="url(#arrow)"/>

  <rect x="336" y="306" width="228" height="104" rx="7" class="boxC"/>
  <text x="450" y="330" class="h" text-anchor="middle">repo-bench match</text>
  <text x="450" y="352" class="b" text-anchor="middle">Per finding, an LLM judge reads the</text>
  <text x="450" y="368" class="b" text-anchor="middle">hunks of every PR touching its file</text>
  <text x="450" y="384" class="b" text-anchor="middle">scoring <tspan class="bi">where</tspan> and <tspan class="bi">what</tspan> separately.</text>
  <text x="450" y="403" class="mono" text-anchor="middle" fill="var(--violet)">weighted_score ∈ [0, 1]</text>
</svg>
