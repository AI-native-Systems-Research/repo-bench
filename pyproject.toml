[project]
name = "repo-bench"
version = "0.1.0"
description = "Benchmark any code-discovery method against a repo's merged perf-PR ground truth."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "repo-bench contributors" }]
keywords = ["benchmark", "llm", "code-analysis", "performance", "ground-truth"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "pydantic>=2",
]

[project.scripts]
repo-bench = "repo_bench.cli:main"

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repo_bench"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# The long line lives inside `PROMPT_TEMPLATE`, whose exact text is hashed into
# `prompt_sha256`. Re-wrapping it would change the hash and break comparability
# with every match report produced so far.
"src/repo_bench/matching.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
files = ["src", "tests"]
mypy_path = "src"
